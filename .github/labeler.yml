documentation:
  - changed-files:
      - any-glob-to-any-file: ["**/*.md", "docs/**"]

tests:
  - changed-files:
      - any-glob-to-any-file: ["**/*.test.ts", "vitest.config.ts"]

ci:
  - changed-files:
      - any-glob-to-any-file: [".github/**"]

ui:
  - changed-files:
      - any-glob-to-any-file: ["src/components/**"]

app:
  - changed-files:
      - any-glob-to-any-file: ["src/app/**"]
