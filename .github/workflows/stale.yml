name: Stale

on:
  schedule:
    - cron: "30 1 * * *"

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v10
        with:
          days-before-stale: 45
          days-before-close: 14
          stale-issue-message: "This issue has been inactive for 45 days and will be closed if there is no further activity."
          stale-pr-message: "This pull request has been inactive for 45 days and will be closed if there is no further activity."
          exempt-issue-labels: "pinned,security"
          exempt-pr-labels: "pinned"
